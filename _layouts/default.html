<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — développeuse fullstack senior · ingénierie LLM{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <main>
    {{ content }}
    <footer class="site">
      <span>© 2026 Chloé Roger — fait à Paris, en Ruby (Jekyll)</span>
      <span><a href="{{ '/a-propos/' | relative_url }}">À propos</a> · <a href="mailto:chloe@bemioz.com">chloe@bemioz.com</a></span>
    </footer>
  </main>
</body>
</html>
